name: Generar Instaladores Multiplataforma

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Empaquetar ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            rid: win-x64
            asset_name: NubeZero-x64.exe
          - os: windows-latest
            arch: arm64
            rid: win-arm64
            asset_name: NubeZero-arm64.exe
          - os: ubuntu-latest
            arch: x64
            rid: linux-x64
            asset_name: NubeZero-x64.AppImage
          - os: ubuntu-latest
            arch: arm64
            rid: linux-arm64
            asset_name: NubeZero-arm64.AppImage
          - os: macos-latest
            arch: x64
            rid: osx-x64
            asset_name: NubeZero-x64.dmg
          - os: macos-latest
            arch: arm64
            rid: osx-arm64
            asset_name: NubeZero-arm64.dmg
          - os: ubuntu-latest
            arch: android
            rid: android
            asset_name: NubeZero.apk

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v5

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Configurar Java 17 (Android)
        if: matrix.rid == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Obtener Versión
        id: get_version
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/public static string Texto/ {gsub(/V/, "", $2); print $2}' src/shared/Version.cs | head -n 1 | tr -d '\r')
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Instalar Workloads MAUI
        if: matrix.rid == 'android'
        run: dotnet workload install maui-android

      - name: Compilar aplicación (Desktop)
        if: matrix.rid != 'android'
        run: |
          cd src/desktop
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish_out

      - name: Compilar aplicación (Mobile APK)
        if: matrix.rid == 'android'
        run: |
          cd src/mobile
          dotnet publish -f net10.0-android -c Release -p:AndroidPackageFormat=apk -o publish_out
          APK_FILE=$(find publish_out -name "*-Signed.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find publish_out -name "*.apk" | head -n 1)
          fi
          cp "$APK_FILE" ${{ github.workspace }}/${{ matrix.asset_name }}

      - name: Compilar Servidor (Raspberry Pi / Mono)
        if: matrix.rid == 'android' # Aprovechamos el runner de Ubuntu para compilar el server 1 sola vez
        run: |
          cd src/server
          dotnet publish -c Release -f net472 -r linux-arm -o publish_out
          cd publish_out
          mkdir -p cli
          cp ../../../cli/nubezero.sh cli/
          zip -r ${{ github.workspace }}/NubeZero-Server.zip *

      # --- EMPAQUETADO WINDOWS ---
      - name: Generar Instalador (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo on
          echo Eliminando .pdb...
          del /q /s "src\desktop\publish_out\*.pdb" 2>nul || ver>nul

          if not exist "C:\PROGRA~2\NSIS\makensis.exe" (
            echo Instalando NSIS...
            choco install nsis -y
          )

          echo Verificando makensis.exe...
          if not exist "C:\PROGRA~2\NSIS\makensis.exe" (
            echo ERROR: No se encontró makensis.exe
            exit /b 1
          )

          echo Verificando script NSIS...
          if not exist "scripts\build\installer.nsi" (
            echo ERROR: El archivo scripts\build\installer.nsi no existe.
            exit /b 1
          )

          echo Ejecutando NSIS...
          "C:\PROGRA~2\NSIS\makensis.exe" /DARCH=${{ matrix.arch }} /DVERSION="${{ env.VERSION }}" "/DPUBLISH_DIR=${{ github.workspace }}\src\desktop\publish_out" "/DOUTFILE=${{ github.workspace }}\${{ matrix.asset_name }}" scripts\build\installer.nsi

          echo Verificando instalador en la raíz...
          dir "${{ github.workspace }}\${{ matrix.asset_name }}"
          if not exist "${{ github.workspace }}\${{ matrix.asset_name }}" (
            echo ERROR: El instalador no se generó en la ubicación esperada.
            exit /b 1
          )

      # --- EMPAQUETADO LINUX ---
      - name: Preparar AppDir (Linux)
        if: runner.os == 'Linux' && matrix.rid != 'android'
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          cp -r src/desktop/publish_out/* AppDir/usr/bin/
          
          # Buscar el binario real dinámicamente y darle permisos
          BINARY=$(find AppDir/usr/bin -maxdepth 1 -type f ! -name "*.so*" ! -name "*.dll" ! -name "*.dbg" | head -n 1)
          if [ -z "$BINARY" ]; then
            echo "ERROR: No se encontró ningún binario en AppDir/usr/bin/"
            ls -la AppDir/usr/bin/
            exit 1
          fi
          chmod +x "$BINARY"
          
          # Crear symlink si el binario no se llama NubeZero
          BINARY_NAME=$(basename "$BINARY")
          if [ "$BINARY_NAME" != "NubeZero" ]; then
            ln -s "$BINARY_NAME" AppDir/usr/bin/NubeZero
          fi
          
          cp src/desktop/Assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/NubeZero.png
          cp src/desktop/Assets/icon.png AppDir/NubeZero.png
          
          cp src/desktop/NubeZero.desktop AppDir/usr/share/applications/
          cp src/desktop/NubeZero.desktop AppDir/
          sed -i "s/^Exec=.*/Exec=NubeZero/" AppDir/usr/share/applications/NubeZero.desktop
          sed -i "s/^Exec=.*/Exec=NubeZero/" AppDir/NubeZero.desktop
          sed -i "s/^Icon=.*/Icon=NubeZero/" AppDir/usr/share/applications/NubeZero.desktop
          sed -i "s/^Icon=.*/Icon=NubeZero/" AppDir/NubeZero.desktop

      - name: Generar AppImage (Linux x64)
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        run: |
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/NubeZero" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export UPDATE_INFORMATION=""
          ./appimagetool-x86_64.AppImage AppDir ${{ matrix.asset_name }} || ./appimagetool-x86_64.AppImage AppDir ${{ matrix.asset_name }} -n

      - name: Generar AppImage (Linux arm64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/NubeZero" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-aarch64
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=aarch64
          ./appimagetool-x86_64.AppImage --runtime-file runtime-aarch64 AppDir ${{ matrix.asset_name }} || ./appimagetool-x86_64.AppImage --runtime-file runtime-aarch64 AppDir ${{ matrix.asset_name }} -n


      # --- EMPAQUETADO MACOS ---
      - name: Preparar App Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_DIR="NubeZero.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          cp -a src/desktop/publish_out/. "$APP_DIR/Contents/MacOS/"
          
          cp src/desktop/Assets/icon.icns "$APP_DIR/Contents/Resources/" || true
          cp src/desktop/Info.plist.template "$APP_DIR/Contents/Info.plist"
          
          plutil -replace CFBundleVersion -string "${{ env.VERSION }}" "$APP_DIR/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "${{ env.VERSION }}" "$APP_DIR/Contents/Info.plist"
          plutil -replace CFBundleExecutable -string "NubeZero" "$APP_DIR/Contents/Info.plist"
          plutil -replace CFBundleIconFile -string "icon.icns" "$APP_DIR/Contents/Info.plist"
          plutil -replace CFBundleIdentifier -string "com.esmesolutions.nubezero" "$APP_DIR/Contents/Info.plist"
          
          xattr -cr "$APP_DIR"
          codesign --force --deep --sign - "$APP_DIR"

      - name: Generar DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          
          create-dmg \
            --volname "NubeZero" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "NubeZero.app" 150 150 \
            --hide-extension "NubeZero.app" \
            --app-drop-link 450 150 \
            "${{ matrix.asset_name }}" \
            "NubeZero.app"

      # --- SUBIR RESULTADO ---
      - name: Subir Archivos a GitHub Releases
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/NubeZero*
          
      - name: Subir Artefacto temporal para Pages
        if: github.event_name == 'release' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows-${{ matrix.arch }}
          path: ${{ github.workspace }}/${{ matrix.asset_name }}
          retention-days: 1
          
      - name: Subir Artefactos para PR o Manual
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.rid }}
          path: ${{ github.workspace }}/NubeZero*

      # 🔹 Debug: Si falla, subimos la carpeta de compilación para inspeccionar
      - name: Subir artefactos de compilación (debug)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: debug-${{ matrix.rid }}
          path: src/desktop/publish_out

  deploy-pages:
    name: Publicar Instaladores en GitHub Pages
    needs: build-and-package
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Descargar instaladores de Windows
        uses: actions/download-artifact@v4
        with:
          path: public-installers
          pattern: installers-windows-*
          merge-multiple: true

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-installers
          keep_files: false
          force_orphan: true